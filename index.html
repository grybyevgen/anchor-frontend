<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морское Судоходство</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Заголовок -->
        <header class="header">
            <h1>⚓ Морское Судоходство</h1>
            <div class="user-info">
                <span id="coins">💰 0</span>
                <div class="user-profile">
                    <img id="user-photo" src="" alt="Фото профиля" class="user-avatar" style="display: none;">
                    <span id="username"></span>
                </div>
            </div>
        </header>

        <!-- Навигация -->
        <nav class="tabs">
            <button class="tab-btn active" data-tab="ships">🚢 Судна</button>
            <button class="tab-btn" data-tab="ports">🏭 Порты</button>
            <button class="tab-btn" data-tab="fleet">⚓ Флот</button>
        </nav>

        <!-- Вкладка: Мои судна -->
        <div id="ships-tab" class="tab-content active">
            <h2>Мои судна</h2>
            <div id="ships-list" class="ships-list">
                <!-- Судна будут загружены динамически -->
            </div>
            <button id="buy-ship-btn" class="btn-primary">Купить судно</button>
        </div>

        <!-- Вкладка: Порты -->
        <div id="ports-tab" class="tab-content">
            <h2>Порты</h2>
            <div id="ports-list" class="ports-list">
                <!-- Порты будут загружены динамически -->
            </div>
        </div>

        <!-- Вкладка: Флот -->
        <div id="fleet-tab" class="tab-content">
            <h2>Мой флот</h2>
            <div id="fleet-stats" class="fleet-stats">
                <!-- Статистика флота -->
            </div>
        </div>

        <!-- Модальное окно для судна -->
        <div id="ship-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modal-title">Управление судном</h2>
                <div id="modal-body"></div>
            </div>
        </div>

        <!-- Модальное окно для порта -->
        <div id="port-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="port-modal-title">Порт</h2>
                <div id="port-modal-body"></div>
            </div>
        </div>

        <!-- Индикатор загрузки -->
        <div id="loading-indicator" class="loading-indicator" style="display: none;">
            <div class="loading-spinner"></div>
            <p>Загрузка...</p>
        </div>

        <!-- Модальное окно подтверждения буксировки -->
        <div id="confirm-tow-modal" class="modal" style="display: none;">
            <div class="modal-content" style="max-width: 400px;">
                <h2>🚢 Буксировка судна</h2>
                <div id="confirm-tow-body" style="margin: 20px 0;"></div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button id="confirm-tow-cancel" class="btn-secondary" style="padding: 10px 20px;">Отмена</button>
                    <button id="confirm-tow-ok" class="btn-primary" style="padding: 10px 20px;">Подтвердить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
