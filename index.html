    <script>
        // Обработка ошибок загрузки ресурсов
        window.addEventListener('error', function(e) {
            if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                console.error('Ошибка загрузки ресурса:', e.target.src || e.target.href);
                // Показываем сообщение пользователю
                if (!document.getElementById('load-error')) {
                    const errorDiv = document.createElement('div');
                    errorDiv.id = 'load-error';
                    errorDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff4444;color:white;padding:10px;text-align:center;z-index:9999;';
                    errorDiv.textContent = 'Ошибка загрузки приложения. Пожалуйста, обновите страницу или обратитесь к разработчику.';
                    document.body.appendChild(errorDiv);
                }
            }
        }, true);
    </script>
