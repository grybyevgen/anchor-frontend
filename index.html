    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Ошибки загрузки только наших скриптов/стилей (не внешних, например telegram-web-app.js)
        window.addEventListener('error', function(e) {
            if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                var src = (e.target.src || e.target.href || '').toString();
                if (src.indexOf('telegram.org') !== -1) {
                    return;
                }
                console.error('Ошибка загрузки ресурса:', src);
                if (!document.getElementById('load-error')) {
                    var errorDiv = document.createElement('div');
                    errorDiv.id = 'load-error';
                    errorDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff4444;color:white;padding:10px;text-align:center;z-index:9999;';
                    errorDiv.textContent = 'Ошибка загрузки. Обновите страницу (pull-to-refresh или F5).';
                    document.body.appendChild(errorDiv);
                }
            }
        }, true);
    </script>
